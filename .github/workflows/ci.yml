name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Development packages are pruned from the standalone image after build.
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/test.mjs   # content validation needs a database, run locally
      - run: npm run test:quality
      - run: npm run test:restore
      - run: npm run test:auth
      - run: npm run test:url-import
      - run: npm run test:import-rollback
      - run: npm run test:openapi-import
      - run: npm run test:space-access
      - run: npm run test:group-grants
      - run: npm run test:change-request-access
      - run: npm run test:resource-access
      - run: npm run test:reading-access
      - run: npm run test:import-search
      - run: npm run test:import-report
      - run: npm run test:markdown-assets
      - run: npm run test:import-plan
      - run: npm run test:import-history
      - run: npm run test:markdown-page-links
      - run: npm run test:markdown-index-collision
      - run: npm run test:markdown-import-plan
      - run: npm run test:template-catalog
      - run: npx next typegen   # route types tsc needs (LayoutProps etc.)
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
      - run: npm run test:space-access-http
      - run: npm run test:change-request-access-http
      - run: npm run test:action-boundaries-http
      - run: npm run test:resource-routes-http
      - run: npm run test:reading-access-http
      - run: npm run test:import-search-http
      - run: npm run test:import-report-http
      - run: npm run test:markdown-assets-http
      - run: npm run test:import-plan-http
      - run: npm run test:import-history-http
      - run: npm run test:markdown-page-links-http
      - run: npm run test:markdown-index-collision-http
      - run: npm run test:markdown-import-plan-http
      - run: npm run test:template-chooser-http
      - run: npm run test:import-report-ui
      - run: npm run test:import-plan-ui
      - run: npm run test:import-history-ui
      - run: npm run test:markdown-page-links-ui
      - run: npm run test:markdown-index-collision-ui
      - run: npm run test:markdown-import-plan-ui
      - run: npm run test:template-chooser-ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: template-chooser-ui
          path: artifacts/template-chooser/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: markdown-import-plan-ui
          path: artifacts/markdown-import-plan/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: markdown-index-collision-ui
          path: artifacts/markdown-index-collision/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: import-plan-ui
          path: artifacts/import-plan/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: import-history-ui
          path: artifacts/import-history/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: markdown-page-links-ui
          path: artifacts/markdown-page-links/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: import-report-ui
          path: artifacts/import-reports/
          if-no-files-found: warn
          retention-days: 7

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/octavo
      - run: helm template charts/octavo > /dev/null
