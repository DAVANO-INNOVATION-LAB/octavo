name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/test.mjs   # content validation needs a database, run locally
      - run: npx next typegen   # route types tsc needs (LayoutProps etc.)
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/octavo
      - run: helm template charts/octavo > /dev/null
