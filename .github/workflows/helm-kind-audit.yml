name: Isolated Helm kind upgrade audit
on:
  push:
    branches: [test/helm-kind-020-02727]
permissions:
  contents: read
concurrency:
  group: octavo-helm-kind-audit
  cancel-in-progress: true
jobs:
  helm-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['0', '1', '2', '3']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Helm and kind tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kube-tools"
          cd "$RUNNER_TEMP/kube-tools"
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar xzf helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64 -o kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          install -m755 kind-linux-amd64 kind
          cp linux-amd64/helm .
          echo "$RUNNER_TEMP/kube-tools" >> "$GITHUB_PATH"
      - name: Create disposable Kubernetes cluster
        run: kind create cluster --name octavo-audit --image kindest/node:v1.34.0 --wait 120s
      - name: Historical chart API validation and live published-image deployment upgrades
        run: python3 scripts/helm-kind-matrix.py '${{ matrix.shard }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: helm-kind-evidence-${{ matrix.shard }}
          path: helm-evidence/
          retention-days: 14
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name octavo-audit
